<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">

<meta name="twitter:card" content="summary">
<title>SeismoHub Lite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d5bd8'/%3E%3Cpath d='M3 17h5l3-8 4 15 3-11 2 4h9' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface-2:#f1f3f7;--text:#111827;--muted:#566074;--faint:#8a93a4;
  --line:#e2e6ec;--line-2:#d2d8e1;--accent:#1d5bd8;--accent-2:#174bb4;--accent-soft:#e9f0ff;--on-accent:#fff;
  --ai:#6b35c9;--ai-soft:#f4efff;--ai-line:#e2d6fb;--mark:#fde68a;--mark-text:#111827;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px rgba(17,24,39,.06);
  --chip-s:80%;--chip-l:94%;--chip-fs:50%;--chip-fl:28%;--edge-s:65%;--edge-l:52%;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c1016;--surface:#141a22;--surface-2:#1b222c;--text:#e7eaf0;--muted:#a6afbd;--faint:#7f8898;
    --line:#26303c;--line-2:#334050;--accent:#7aa5ff;--accent-2:#9bbcff;--accent-soft:#18243b;--on-accent:#0c1016;
    --ai:#bba2ff;--ai-soft:#201a31;--ai-line:#3a2d5c;--mark:#77621a;--mark-text:#fff;
    --shadow:none;
    --chip-s:35%;--chip-l:20%;--chip-fs:70%;--chip-fl:82%;--edge-s:55%;--edge-l:60%;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-wrap:break-word;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:8px;top:8px;z-index:100;background:var(--surface);padding:6px 10px;border-radius:8px}
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
@supports ((backdrop-filter:blur(8px)) or (-webkit-backdrop-filter:blur(8px))){
  .top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
}
.top-inner{max-width:1240px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.15}
.brand-name span{color:var(--accent)}
.brand-sub{font-size:12.5px;color:var(--muted)}
.top-actions{display:flex;gap:6px}
.searchrow{display:flex;gap:8px;width:100%}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:0 12px;height:44px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:16px}
select{height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);padding:0 10px;max-width:42vw}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{height:30px;padding:0 11px;font-size:12.5px}
.btn svg{width:15px;height:15px;flex:none}
.icon-btn{width:36px;height:36px;flex:none;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.filters-toggle{display:none;height:44px;border-radius:12px}
.filters-toggle .badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:1px 7px}
.layout{max-width:1240px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.filters{position:sticky;top:var(--top-h,124px);max-height:calc(100vh - var(--top-h,124px) - 12px);overflow:auto;padding-right:4px;overscroll-behavior:contain}
.filters-head,.filters-foot{display:none}
.facet{border-bottom:1px solid var(--line);padding:4px 0}
.facet>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 2px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facet>summary::-webkit-details-marker{display:none}
.facet>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);transition:transform .15s;margin-left:auto}
.facet[open]>summary::after{transform:rotate(45deg)}
.facet .badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:1px 7px;letter-spacing:0}
.fsearch{width:100%;height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 9px;margin:0 0 6px;font-size:14px}
.fvals{display:flex;flex-direction:column;gap:1px;padding-bottom:6px}
.fval{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.35}
.fval:hover{background:var(--surface-2)}
.fval input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.fval .v{flex:1;min-width:0;overflow-wrap:anywhere}
.fval .n{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.fval.on{background:var(--accent-soft)}
.fval.zero .v{color:var(--faint)}
.fhint{font-size:12px;color:var(--faint);padding:2px 6px 6px}
.fnote{font-size:11.5px;line-height:1.4;color:var(--faint);padding:0 6px 6px}
.fsub{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:9px 6px 3px;border-top:1px dashed var(--line);margin-top:4px}
.fsub:first-child{border-top:0;margin-top:0;padding-top:2px}
/* date filter: three quick windows, then the year / month list under "Custom" */
.dcustom{margin:0 0 4px}
.dcustom>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.dcustom>summary::-webkit-details-marker{display:none}
.dcustom>summary::before{content:"\25B8";font-size:11px;transition:transform .15s}
.dcustom[open]>summary::before{transform:rotate(90deg)}
.dcustom>summary:hover{background:var(--surface-2)}
.dcustom .badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:1px 7px}
.dcustom .fvals{padding-left:14px}
.fval.yr .v{font-weight:700}
.resultbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;min-height:30px}
.count{font-weight:700;font-size:14px;margin-right:4px}
.active{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.achip{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:2px 6px 2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0;font-size:12.5px;font-weight:600;cursor:pointer;max-width:100%;text-align:left}
.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.achip b{font-weight:500;opacity:.8}
.achip i{font-style:normal;font-size:16px;line-height:1;padding:0 3px}
.linkish{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;font-weight:600;padding:4px;text-decoration:underline;text-underline-offset:2px}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid hsl(var(--h,215) calc(var(--edge-s) * var(--k,1)) var(--edge-l));border-radius:var(--radius);padding:16px 18px 14px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--top-h,124px) + 4px)}
.card.flash{outline:2px solid var(--accent);outline-offset:2px}
.card.gray{border-left-color:var(--line-2)}
.card-head{display:flex;align-items:flex-start;gap:12px}
.meta{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);flex:1;min-width:0;padding-top:2px;overflow-wrap:anywhere}
.meta .date,.kicker .date{color:var(--muted);font-weight:400;letter-spacing:.03em}
.jn{font-weight:300;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;max-width:100%;border:0;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;line-height:1.4;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.chip.t{background:hsl(var(--h,215) calc(var(--chip-s) * var(--k,1)) var(--chip-l));color:hsl(var(--h,215) calc(var(--chip-fs) * var(--k,1)) var(--chip-fl))}
.chip.t.gray{background:var(--surface-2);color:var(--muted)}
.chip.k{background:var(--ai-soft);color:var(--ai)}
.chip.f{background:var(--surface-2);color:var(--muted);border-radius:6px}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.chip:hover{filter:brightness(.95)}
.title{margin:10px 0 6px;font-size:21px;line-height:1.28;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
.title a{color:var(--text);text-decoration:none}
.title a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.authors{font-size:13.5px;color:var(--muted)}
.authors .more{color:var(--faint);white-space:nowrap}
/* one small person icon per author; the icons separate the names on screen */
.au{display:inline-block;max-width:100%;margin-right:.6em}
.au svg{width:.86em;height:.86em;margin-right:.28em;vertical-align:-.1em;color:var(--faint)}
/* visually hidden but still read aloud and copied: the commas between author names.
   Kept inline (not position:absolute) so copied text and innerText get no line breaks. */
.vh{display:inline-block;width:1px;height:1px;margin-right:-1px;overflow:hidden;clip-path:inset(50%);white-space:pre}
.kwrow{display:flex;align-items:flex-start;gap:7px;margin-top:8px}
.kwrow>svg{width:14px;height:14px;flex:none;margin-top:4px;color:var(--ai);opacity:.75}
.kwrow>.chips{margin-top:0;flex:1;min-width:0}
.inst{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--faint);margin-top:4px}
.inst svg{width:13px;height:13px;flex:none;margin-top:3px}
.takeaway{margin:10px 0 0;font-size:14px;background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:10px;padding:8px 10px}
.ai-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ai);border:1px solid var(--ai-line);background:var(--surface);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:1px;cursor:help}
.absd{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.absd>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px}
.absd>summary::-webkit-details-marker{display:none}
.absd>summary::before{content:"\25B8";font-size:11px;transition:transform .15s}
.absd[open]>summary::before{transform:rotate(90deg)}
.abs{font-size:14px;line-height:1.62;margin:8px 0 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
mark{background:var(--mark);color:var(--mark-text);border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted)}
.empty p{margin:6px 0 0}
.more-wrap{display:flex;justify-content:center;margin-top:18px}
#sentinel{height:1px}
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.6}
.foot-inner{max-width:1240px;margin:0 auto;padding:20px 16px 34px;display:grid;gap:8px}
.foot p{margin:0}
.foot strong{color:var(--text)}
.foot .links{display:flex;flex-wrap:wrap;gap:4px 16px}
.foot .links button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(940px,calc(100vw - 32px));max-width:none;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
@media (min-width:641px){#detail{height:calc(100vh - 32px);height:calc(100dvh - 32px)}}
dialog::backdrop{background:rgba(8,12,20,.55)}
.dlg-bar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.dlg-bar .kicker{flex:1;min-width:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-bar .actions{margin:0;flex-wrap:nowrap}
/* flex-basis must stay auto: Safari/WebKit collapses a 0% basis (plain "flex:1") to nothing in a dialog without a fixed height */
.dlg-body{overflow:auto;padding:18px 20px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.d-title{font-size:23px;line-height:1.28;margin:10px 0 8px;font-weight:780;overflow-wrap:anywhere}
.d-authors{font-size:14px;color:var(--muted)}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.sec{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sec p{margin:0}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.sec.ai{border-color:var(--ai-line)}
.sec.ai h3{color:var(--ai)}
.aiwrap{margin-top:20px;border-top:2px solid var(--ai-line);padding-top:4px}
.notice{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.5;border-radius:12px;padding:10px 12px;margin-top:12px}
.notice.ai{background:var(--ai-soft);border:1px solid var(--ai-line)}
.notice.cr{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pill{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:14px}
.pill b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pill small{display:block;color:var(--faint);margin-top:6px;font-size:11.5px}
.tm{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface-2)}
.tm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:13.5px}
.tm-h span{color:var(--accent);font-size:12px;white-space:nowrap}
.tm p{font-size:13px;color:var(--muted);margin-top:3px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 12px;font-size:13.5px;align-items:start;margin:0}
.kv dt{color:var(--faint);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0;display:flex;flex-wrap:wrap;gap:5px;overflow-wrap:anywhere}
.fig{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.fig:first-of-type{margin-top:0}
.fig h4{margin:0 0 4px;font-size:13.5px}
.fig p{font-size:13.5px;margin:4px 0 0}
.muted{color:var(--muted)}
.loading{color:var(--muted);font-size:14px;padding:14px 2px}
.prose h3{font-size:14.5px;margin:18px 0 4px}
.prose h3:first-child{margin-top:0}
.prose p{margin:4px 0 8px;font-size:14px;line-height:1.65}
.rb-end{margin-left:auto;display:flex;align-items:center;gap:12px}
.exports{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
/* Browse directory: on wide screens it gets its own column on the right, so it never
   takes the filters' place. Rows follow the current list; a click jumps to the card. */
.dir{display:none;position:sticky;top:var(--top-h,124px);max-height:calc(100vh - var(--top-h,124px) - 12px);flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dir-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.dir-head strong{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dir-head .n{margin-right:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.dir-head .icon-btn{width:28px;height:28px;font-size:17px}
.dir-cols,.drow{display:grid;grid-template-columns:minmax(0,1fr) 70px 76px;gap:8px;align-items:center}
.dir-cols{padding:6px 12px 6px 14px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dir-cols span:last-child,.drow .d{text-align:right}
.dir-list{position:relative;flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 0 8px}
.drow{width:100%;margin:0;border:0;border-left:3px solid hsl(var(--h,215) calc(var(--edge-s) * var(--k,1)) var(--edge-l));background:none;padding:4px 12px 4px 11px;font-size:12.5px;line-height:1.35;text-align:left;color:var(--text);cursor:pointer}
.drow.gray{border-left-color:var(--line-2)}
.drow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .j{color:var(--muted)}
.drow .d{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.drow:hover{background:var(--surface-2)}
.drow.cur{background:var(--accent-soft)}
.drow.cur .a{font-weight:700}
.drow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dir-empty{padding:14px;font-size:13px;color:var(--faint)}
.dir-btn{display:none}
.dir-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
@media (min-width:901px){.facet[data-key="journal"] .fvals{max-height:min(380px,48vh);overflow:auto}}
@media (min-width:1200px){
  .dir-btn{display:inline-flex}
  body.dir-on .layout{max-width:1580px;grid-template-columns:270px minmax(0,1fr) 290px;gap:20px}
  body.dir-on .top-inner,body.dir-on .foot-inner{max-width:1580px}
  body.dir-on .dir{display:flex}
  /* keep "back to top" off the directory: at the right edge of the paper column */
  body.dir-on .totop{right:calc(max(0px, (100vw - 1580px) / 2) + 16px + 290px + 20px + 12px)}
}

  // Only full dates get an age, so a year-only date is never "in the last 7 days".
  const ref = dayOf(DATA.generated) != null ? dayOf(DATA.generated) : newest;
  for (const p of DATA.papers) p._age = p._day != null && ref != null ? ref - p._day : null;
  for (const [key, forms] of kwForms) KW_LABEL.set(key, [...forms.entries()].sort((a, b) => b[1] - a[1])[0][0]);
  DATA.ready = true;
}

function loadAbstracts() {

    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(map => {

        if (text) { p.ab = text; p._hay = null; }

    })

}

  else { fillAbsNodes(listEl); renderCount(); }

function compute() {
  const P = DATA.papers; const n = P.length;
  const toks = S.tokens.map(fold);
  const fOk = {};
  const win = Number(S.win) || 0;
  for (const f of FACETS) {
    const sel = S.sel[f.key];
    const w = f.key === 'date' ? win : 0; // the date filter is a window or a custom choice of years / months
    if (!sel.size && !w) { fOk[f.key] = null; continue; }
    const ok = new Uint8Array(n);
    if (w) { for (let i = 0; i < n; i++) { const a = P[i]._age; if (a != null && a < w) ok[i] = 1; } }
    else for (let i = 0; i < n; i++) { for (const v of P[i]._f[f.key]) { if (sel.has(v)) { ok[i] = 1; break; } } }
    fOk[f.key] = ok;
  }
  const counts = {}; for (const f of FACETS) counts[f.key] = new Map();
  const bump = (key, vals) => { const m = counts[key]; for (const v of vals) m.set(v, (m.get(v) || 0) + 1); };
  const wc = { all: 0, 7: 0, 30: 0 }; // like any facet count: papers that pass every filter except the date
  const results = [];
  for (let i = 0; i < n; i++) {
    const p = P[i];
    if (toks.length) { const hs = hay(p); if (!toks.every(t => hs.includes(t))) continue; }
    let fails = 0; let failKey = null;
    for (const f of FACETS) { const ok = fOk[f.key]; if (ok && !ok[i]) { fails++; failKey = f.key; if (fails > 1) break; } }
    if (fails === 0) { results.push(p); for (const f of FACETS) bump(f.key, p._f[f.key]); }
    else if (fails === 1) bump(failKey, p._f[failKey]);
    if (fails === 0 || (fails === 1 && failKey === 'date')) {
      wc.all++;
      const a = p._age;
      if (a != null) { if (a < 30) wc[30]++; if (a < 7) wc[7]++; }
    }
  }
  const byDate = (a, b) => (a._dk < b._dk ? 1 : a._dk > b._dk ? -1 : (a.id < b.id ? -1 : 1));
  if (S.sort === 'old') results.sort((a, b) => byDate(b, a));
  else if (S.sort === 'title') results.sort((a, b) => collator.compare(a.t, b.t) || byDate(a, b));
  else results.sort(byDate);
  return { results, counts, win: wc };
}

function renderDateFacet(det) {

  const nOn = sel.size + (S.win ? 1 : 0);

/* ------------------------------------------------------------------ citations: BibTeX / RIS, built in the browser */
const MISC_VENUE = /\b(arxiv|ess open archive|eartharxiv|research square|zenodo|figshare|hal|osti|workflowhub|repository|data services|data collection|dataset|thesis|general assembly|discussions|computing center|publication database|seismological facility|copernicus|workshop)\b/i;
const BIB_MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const BIB_STOP = new Set(['the', 'and', 'for', 'from', 'with', 'into', 'over', 'under', 'using', 'via', 'new', 'its', 'are', 'how']);
const TEX = { '\\': '\\textbackslash{}', '{': '\\{', '}': '\\}', '%': '\\%', '&': '\\&', '#': '\\#', '_': '\\_', '$': '\\$', '~': '\\textasciitilde{}', '^': '\\textasciicircum{}' };
const tex = s => String(s || '').replace(/[\\{}%&#_$~^]/g, c => TEX[c]);
const isMisc = p => p.src === 'arxiv' || MISC_VENUE.test(p.j);
const arxivId = url => { const m = /arxiv\.org\/abs\/([^\s?#]+?)(v\d+)?$/i.exec(url || ''); return m ? m[1] : ''; };
const paperUrl = p => p.url || (p.doi ? doiUrl(p.doi) : '');
function bibKey(p, used) {
  const first = String(p.a[0] || 'anon');
  const family = (first.includes(',') ? first.split(',')[0] : first.trim().split(/\s+/).pop()) || 'anon';
  const word = (fold(p.t).match(/[a-z0-9]+/g) || []).find(w => w.length > 2 && !BIB_STOP.has(w)) || '';
  const base = (fold(family).replace(/[^a-z0-9]/g, '') || 'anon') + (p.d.slice(0, 4) || 'nd') + word;
  let key = base; let n = 1;
  while (used.has(key)) { n += 1; key = base + (n <= 26 ? String.fromCharCode(96 + n) : String(n)); }
  used.add(key);
  return key;
}
function bibtex(list) {
  const used = new Set();
  return list.map(p => {
    const lines = [];
    const field = (k, v, bare) => { if (v) lines.push(`  ${k} = ${bare ? v : '{' + v + '}'},`); };
    field('author', p.a.map(tex).join(' and '));
    field('title', `{${tex(p.t)}}`);
    field(isMisc(p) ? 'howpublished' : 'journal', tex(p.j));
    field('year', p.d.slice(0, 4));
    const m = Number(p.d.slice(5, 7));
    if (m >= 1 && m <= 12) field('month', BIB_MONTHS[m - 1], true);
    const ax = arxivId(p.url);
    if (ax) { field('eprint', ax); field('archiveprefix', 'arXiv'); }
    field('doi', p.doi.replace(/[{}]/g, ''));
    field('url', paperUrl(p).replace(/[{}]/g, ''));
    return `@${isMisc(p) ? 'misc' : 'article'}{${bibKey(p, used)},\n${lines.join('\n')}\n}`;
  }).join('\n\n') + '\n';
}
function ris(list) {
  const out = [];
  for (const p of list) {
    const line = (tag, v) => { v = String(v || '').replace(/\s+/g, ' ').trim(); if (v) out.push(`${tag}  - ${v}`); };
    line('TY', isMisc(p) ? 'GEN' : 'JOUR');
    for (const a of p.a) line('AU', a);
    line('TI', p.t);
    line(isMisc(p) ? 'PB' : 'T2', p.j);
    line('PY', p.d.slice(0, 4));
    if (p.d.length >= 10) line('DA', p.d.replace(/-/g, '/'));
    line('DO', p.doi);
    line('UR', paperUrl(p));
    out.push('ER  - ', '');
  }
  return out.join('\r\n');
}
function download(text, name, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h('a', { href: url, download: name, hidden: true });

  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

function topSpy() { let m = Infinity; for (const i of spyOn) if (i < m) m = i; return m === Infinity ? -1 : m; }

  S.q = (sp.get('q') || '').slice(0, 300);
  S.sort = SORTS.includes(sp.get('sort')) ? sp.get('sort') : 'new'; // an old sort=rel link falls back to newest
  for (const f of FACETS) S.sel[f.key] = new Set(sp.getAll(f.key).filter(Boolean).slice(0, 50));
  // Links from before the date filter used year= and month=; they become custom date choices.
  for (const v of [...sp.getAll('year'), ...sp.getAll('month')]) S.sel.date.add(v);
  S.sel.date = new Set([...S.sel.date].filter(v => /^\d{4}(-\d{2})?$/.test(v)));
  S.win = WINDOWS.includes(sp.get('win')) ? sp.get('win') : '';
  if (S.win) S.sel.date.clear();
  const l = sp.get('lang'); if (l === 'en' || l === 'zh') S.lang = l;
  const p = sp.get('p'); S.p = p && /^[0-9a-f]{16}$/.test(p) ? p : null;

  for (const f of FACETS) for (const v of S.sel[f.key]) sp.append(f.key, v);
  if (isZh()) sp.set('lang', 'zh');

  lastHash = hs;

}

  qInput.value = S.q; sortSel.value = S.sort;

listEl.addEventListener('click', e => {
  const op = e.target.closest('[data-open]');
  if (op) {
    if (op.tagName === 'A' && (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)) return;
    e.preventDefault();
    openDetail(op.getAttribute('data-open'));
    return;
  }
  const fc = e.target.closest('[data-facet]');
  if (fc) { e.preventDefault(); const key = fc.getAttribute('data-facet'); const v = fc.getAttribute('data-value'); setFacet(key, v, !S.sel[key].has(v)); }
});
moreBtn.addEventListener('click', () => appendBatch(BATCH));
if ('IntersectionObserver' in window) {
  new IntersectionObserver(entries => {
    if (entries.some(en => en.isIntersecting) && DATA.ready && S.shown < computed.results.length) appendBatch(BATCH);
  }, { rootMargin: '600px 0px' }).observe($('#sentinel'));
}
function setDrawer(open) {
  filtersEl.classList.toggle('open', open);
  document.body.classList.toggle('lock', open);
  filtersBtn.setAttribute('aria-expanded', String(open));
  if (open) $('#filtersClose').focus(); else filtersBtn.focus();
}
filtersBtn.addEventListener('click', () => setDrawer(true));
$('#filtersClose').addEventListener('click', () => setDrawer(false));
$('#showResults').addEventListener('click', () => setDrawer(false));
$('#clearAllMobile').addEventListener('click', clearAll);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && filtersEl.classList.contains('open')) { setDrawer(false); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
  if (e.key === '/' && !typing && !dlg.open && !aboutDlg.open) { e.preventDefault(); qInput.focus(); }
});
function measureTop() { document.documentElement.style.setProperty('--top-h', (topEl.offsetHeight + 12) + 'px'); }
window.addEventListener('resize', measureTop);

/* ------------------------------------------------------------------ boot */
(function boot() {
  let stored = null;
  try { stored = localStorage.getItem(LS_LANG); } catch (e) { stored = null; }
  S.lang = stored === 'zh' || stored === 'en' ? stored : ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
  try { dirOn = localStorage.getItem(LS_DIR) !== 'off'; } catch (e) { dirOn = true; }
  setDir(dirOn, false); // before the first render, so the layout does not jump
  readHash();
  qInput.value = S.q;
  applyStaticText();
  measureTop();
  startSpy();
  listEl.replaceChildren(h('div', { class: 'loading' }, T('loading')));
  fetch('data/papers.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(doc => {
      init(doc);
      for (const f of FACETS) S.sel[f.key] = new Set([...S.sel[f.key]]);
      applyStaticText();
      buildFacets();
      refresh();
      lastHash = location.hash.replace(/^#/, '');
      if (S.p && DATA.byId.has(S.p)) openDetail(S.p, true);
      setTimeout(loadAbstracts, 30); // after the first render
    })
    .catch(err => {
      console.error(err);
      countEl.textContent = '';
      listEl.replaceChildren(h('div', { class: 'empty' }, h('strong', null, T('loadError')), h('p', null, T('loadHint'))));
    });
})();
})();
</script>
</body>
</html>
